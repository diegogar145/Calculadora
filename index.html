<!DOCTYPE html>
    <head>

        <script src="misScripts.js"></script>
    </head>

        <h1>Calculadora</h1>

        <input type="number" id="segundoNumero">

        <br><br>

        <button onclick="dividir()">/</button>
        <br><br>
        <button onclick="potencia()">^</button>
        <br><br>
        <button onclick="raizCuadra()">√</button>
    </body>
